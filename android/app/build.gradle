plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.dutchman175.familydashboard"
    compileSdk 34

    defaultConfig {
        applicationId "com.dutchman175.familydashboard"
        minSdk 22
        targetSdk 34
        versionCode 7
        versionName "1.5.0"
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    signingConfigs {
        // Public sideload key. The password is not a secret: anyone can rebuild
        // the same signed APK, which is what lets an update install over this one.
        release {
            storeFile rootProject.file("family-dashboard.keystore")
            storePassword "familydashboard"
            keyAlias "familydashboard"
            keyPassword "familydashboard"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        abortOnError true
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/LICENSE.md",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/NOTICE.md",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1"
            ]
        }
    }

    // One copy of the page lives at the repo root. The APK serves that copy.
    def generatedAssets = new File(buildDir, "generated/dashboardAssets")
    sourceSets.main.assets.srcDir(generatedAssets)
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "net.sf.biweekly:biweekly:0.6.8"
    testImplementation "junit:junit:4.13.2"
    // The unit-test android.jar stubs org.json. This real jar is prepended below.
    testImplementation "org.json:json:20240303"
}

tasks.withType(Test).configureEach {
    // The TiVo has 2 GB of RAM. Parsing the ~1 MB feed must stay well under that.
    maxHeapSize = "128m"
    // Prefer the real org.json over the stubbed copy inside android.jar.
    classpath = files({
        configurations.getByName("testRuntimeClasspath").files.findAll {
            it.name.startsWith("json-") && it.name.endsWith(".jar")
        }
    }) + classpath
}

def generatedAssetsDir = new File(buildDir, "generated/dashboardAssets")

tasks.register("copyDashboardWeb", Copy) {
    from(rootProject.file("../index.html"))
    from(rootProject.file("../styles.css"))
    from(rootProject.file("../app.js"))
    from(rootProject.file("../jokes.js"))
    from(rootProject.file("../manifest.json"))
    from(rootProject.file("../icon-192.png"))
    from(rootProject.file("../icon-512.png"))
    into(new File(generatedAssetsDir, "dashboard"))
}

tasks.named("preBuild").configure {
    dependsOn("copyDashboardWeb")
}

tasks.configureEach { task ->
    def n = task.name.toLowerCase()
    if (n.contains("merge") && n.contains("assets")) {
        task.dependsOn("copyDashboardWeb")
    }
}

tasks.configureEach { task ->
    if (task.name == "assembleRelease") {
        task.doLast {
            def outDir = layout.buildDirectory.dir("outputs/apk/release").get().asFile
            def built = new File(outDir, "app-release.apk")
            def named = new File(outDir, "FamilyDashboard.apk")
            if (built.exists()) {
                built.renameTo(named)
            }
        }
    }
}
