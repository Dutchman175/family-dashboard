<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e131b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Family Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
<div id="stage" class="stage">
  <div id="dashboard" class="dashboard">
    <section class="panel panel-photo" id="photo" aria-hidden="true">
      <div class="photo-frame" id="photo-frame">
        <img id="photo-bg-a" class="photo-blur" alt="">
        <img id="photo-bg-b" class="photo-blur" alt="">
        <img id="photo-a" class="photo-img" alt="">
        <img id="photo-b" class="photo-img" alt="">
      </div>
      <div id="photo-settings" class="photo-settings" aria-hidden="true">
        <p class="kicker">Slideshow</p>
        <p class="photo-settings-label">Seconds per photo</p>
        <p id="photo-seconds" class="photo-settings-value">18</p>
        <p class="photo-settings-hint">Left and right change it · OK closes</p>
      </div>
    </section>
    <div class="main-col">
    <header class="panel panel-clock">
      <div class="clock-row">
        <p id="clock" class="clock">12:00</p>
        <p id="ampm" class="ampm">PM</p>
      </div>
      <p id="date" class="date">Saturday, October 24</p>
      <p id="zone" class="zone">Central Time</p>
    </header>

    <!--
      More panels (chores, countdowns) go in .panel-row
      as more <section class="panel"> blocks.
    -->
    <div class="panel-row">
      <section class="panel panel-weather" id="weather" aria-live="polite">
        <div id="weather-status" class="weather-status">
          <p id="weather-status-title" class="status-title">Loading weather</p>
          <p id="weather-status-body" class="status-body">Checking the forecast for Lowell, Indiana.</p>
        </div>
        <div id="weather-body" class="weather-body">
          <div id="weather-current" class="weather-current"></div>
          <div id="weather-forecast" class="weather-forecast"></div>
        </div>
      </section>
      <section class="panel panel-messages" id="messages" aria-live="polite" aria-hidden="true">
        <p class="kicker">Messages</p>
        <div id="message-list" class="message-list"></div>
      </section>
      <section class="panel panel-calendar" id="calendar" aria-live="polite">
        <p class="kicker">Upcoming</p>
        <div id="calendar-list" class="calendar-list"></div>
        <p id="calendar-note" class="calendar-note"></p>
      </section>
    </div>
    </div>
    <div id="month" class="month" aria-hidden="true">
      <div class="month-head">
        <p id="month-title" class="month-title"></p>
        <p class="month-hint">Left and right change month · Back returns</p>
      </div>
      <div class="month-dow">
        <p>Sun</p>
        <p>Mon</p>
        <p>Tue</p>
        <p>Wed</p>
        <p>Thu</p>
        <p>Fri</p>
        <p>Sat</p>
      </div>
      <div id="month-grid" class="month-grid"></div>
    </div>
  </div>
</div>
<noscript>
  <p class="noscript">JavaScript is off, so the clock and weather cannot run.</p>
</noscript>
<script src="app.js?v=9"></script>
</body>
</html>
